# Replace the existing static `location /` in the website's HTTPS server block.
# Preserve the existing server_name and TLS certificate settings.
client_max_body_size 150m;
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
# Remove any older static locations for /photos/, /gallery/, /logo.png or /api/;
# they must also reach the Node server for live edits to appear.
